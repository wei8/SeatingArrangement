        // 保存参会人员编辑
        function saveAttendeeEdit() {
            const attendeeId = document.getElementById('editAttendeeId').value;
            const name = document.getElementById('editAttendeeName').value.trim();
            const position = document.getElementById('editAttendeePosition').value.trim();
            const organization = document.getElementById('editAttendeeOrganization').value.trim();
            
            // 验证姓名是否填写
            if (!name) {
                showMessage('请输入参会人员姓名', 'warning');
                document.getElementById('editAttendeeName').focus();
                return;
            }
            
            // 找到要编辑的参会人员
            const attendeeIndex = attendees.findIndex(a => a.id === attendeeId);
            if (attendeeIndex === -1) {
                showMessage('未找到该参会人员', 'error');
                return;
            }
            
            // 更新参会人员信息
            attendees[attendeeIndex].name = name;
            attendees[attendeeIndex].position = position || '';
            attendees[attendeeIndex].organization = organization || '';
            
            // 如果已分配座位，更新座位上的显示
            if (attendees[attendeeIndex].assignedSeat) {
                const { type, row, number, area } = attendees[attendeeIndex].assignedSeat;
                const seatElement = document.querySelector(`[data-type="${type}"][data-row="${row}"][data-number="${number}"]${type === 'audience' ? `[data-area="${area}"]` : ''}`);
                if (seatElement) {
                    seatElement.textContent = name;
                }
            }
            
            // 更新参会人员列表
            updateAttendeeList();
            
            // 关闭编辑窗口
            closeAttendeeEditModal();
            
            // 显示成功消息
            showMessage('参会人员信息已成功更新', 'success');
            
            // 触发缓存保存
            if (window.meetingCacheManager) {
                window.meetingCacheManager.triggerSave();
            }
        }
        
        // 为编辑窗口按钮添加事件监听
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('cancelEditBtn').addEventListener('click', closeAttendeeEditModal);
            document.getElementById('saveEditBtn').addEventListener('click', saveAttendeeEdit);
            
            // 点击模态窗口外部关闭窗口
            document.getElementById('attendeeEditModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeAttendeeEditModal();
                }
            });
            
            // ESC键关闭窗口
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && document.getElementById('attendeeEditModal').style.display === 'flex') {
                    closeAttendeeEditModal();
                }
            });
        });
        
        // 拖拽开始
        function handleAttendeeDragStart(e) {
            draggedAttendee = attendees.find(a => a.id === e.target.dataset.attendeeId);
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedAttendee.id);
        }
        
        // 拖拽结束
        function handleAttendeeDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedAttendee = null;
            
            // 清除所有拖拽悬停效果
            document.querySelectorAll('.seat.drag-over').forEach(seat => {
                seat.classList.remove('drag-over');
            });
        }
        
        // 修改座位选择函数，添加拖拽支持
        function selectSeat(seatElement) {
            // 清除之前的选择
            document.querySelectorAll('.seat.selected').forEach(seat => {
                seat.classList.remove('selected');
            });
            
            // 选择当前座位
            seatElement.classList.add('selected');
            selectedSeat = seatElement;
            
            // 显示座位信息
            showSeatInfo(seatElement);
        }
        
        // 修改显示座位信息函数
        function showSeatInfo(seatElement) {
            const type = seatElement.dataset.type;
            const row = seatElement.dataset.row;
            const number = seatElement.dataset.number;
            const area = seatElement.dataset.area || '-';
            
            // 查找当前座位上的人员
            const assignedAttendee = attendees.find(a => 
                a.assignedSeat && 
                a.assignedSeat.type === type && 
                a.assignedSeat.row == row && 
                a.assignedSeat.number == number &&
                (type === 'leader' || a.assignedSeat.area === area)
            );
            
            let info = `
                <p><strong>座位类型：</strong>${type === 'leader' ? '领导席' : '观众席'}</p>
                <p><strong>座位编号：</strong>${row}-${number}</p>
            `;
            
            if (type === 'audience') {
                info += `<p><strong>区域：</strong>${area}</p>`;
            }
            
            info += `<p><strong>状态：</strong>${seatElement.classList.contains('occupied') ? '已占用' : '空闲'}</p>`;
            
            if (assignedAttendee) {
                info += `
                    <hr style="margin: 1rem 0;">
                    <p><strong>参会人员：</strong>${assignedAttendee.name}</p>
                    <p><strong>职务：</strong>${assignedAttendee.position || '暂无'}</p>
                    <p><strong>机构：</strong>${assignedAttendee.organization || '暂无'}</p>
                `;
            }
            
            // 添加操作按钮
            info += `
                <div style="margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    ${assignedAttendee ? 
                        `<button class="btn btn-warning" onclick="unassignAttendeeFromSeat('${assignedAttendee.id}')" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">移除人员</button>` :
                        `<button class="btn btn-primary" onclick="assignAttendeeToSeat('${row}', '${number}', '${type}', '${area}')" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">分配人员</button>`
                    }
                    <button class="btn btn-secondary" onclick="closeSeatModal()" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">关闭</button>
                </div>
            `;
            
            document.getElementById('seatInfo').innerHTML = info;
            document.getElementById('seatModal').style.display = 'block';
        }
        
        // 为座位添加拖拽事件
        function addSeatDragEvents() {
            document.querySelectorAll('.seat').forEach(seat => {
                seat.addEventListener('dragover', handleSeatDragOver);
                seat.addEventListener('drop', handleSeatDrop);
                seat.addEventListener('dragenter', handleSeatDragEnter);
                seat.addEventListener('dragleave', handleSeatDragLeave);
                
                // 双击事件
                seat.addEventListener('dblclick', handleSeatDoubleClick);
            });
        }
        
        // 拖拽悬停
        function handleSeatDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }
        
        // 拖拽进入
        function handleSeatDragEnter(e) {
            e.preventDefault();
            if (draggedAttendee) {
                e.target.classList.add('drag-over');
            }
        }
        
        // 拖拽离开
        function handleSeatDragLeave(e) {
            e.target.classList.remove('drag-over');
        }
        
        // 拖拽放下
        function handleSeatDrop(e) {
            e.preventDefault();
            e.target.classList.remove('drag-over');
            
            if (!draggedAttendee) return;
            
            const type = e.target.dataset.type;
            const row = e.target.dataset.row;
            const number = e.target.dataset.number;
            const area = e.target.dataset.area || '';
            
            // 直接分配拖拽的人员到座位，不显示选择弹窗
            directAssignAttendeeToSeat(draggedAttendee, row, number, type, area);
        }
        
        // 直接分配参会人员到座位（拖拽时使用）
        function directAssignAttendeeToSeat(attendee, row, number, type, area) {
            // 如果拖拽的人员已经在其他座位上，先从原座位移除
            if (attendee.assignedSeat) {
                const { type: oldType, row: oldRow, number: oldNumber, area: oldArea } = attendee.assignedSeat;
                const oldSeatElement = document.querySelector(`[data-type="${oldType}"][data-row="${oldRow}"][data-number="${oldNumber}"]${oldType === 'audience' ? `[data-area="${oldArea}"]` : ''}`);
                if (oldSeatElement) {
                    oldSeatElement.classList.remove('occupied');
                }
            }
            
            // 检查目标座位是否被占用，如果是，先移除原人员
            const existingAttendee = attendees.find(a => 
                a.assignedSeat && 
                a.assignedSeat.type === type && 
                a.assignedSeat.row == row && 
                a.assignedSeat.number == number &&
                (type === 'leader' || a.assignedSeat.area === area)
            );
            
            if (existingAttendee) {
                // 移除原座位上的人员
                existingAttendee.assignedSeat = null;
            }
            
            // 分配新座位
            attendee.assignedSeat = { type, row: parseInt(row), number: parseInt(number), area };
            
            // 更新座位状态
            const seatElement = document.querySelector(`[data-type="${type}"][data-row="${row}"][data-number="${number}"]${type === 'audience' ? `[data-area="${area}"]` : ''}`);
            if (seatElement) {
                seatElement.classList.add('occupied');
                // 分配后显示姓名
                seatElement.textContent = attendee.name;
            }
            
            // 更新列表显示
            updateAttendeeList();
            
            showMessage(`已将 ${attendee.name} 分配到座位 ${row}-${number}`, 'success');
            
            // 清除拖拽状态
            draggedAttendee = null;
        }
        
        // 双击座位分配人员
        function handleSeatDoubleClick(e) {
            // 清除之前的选择
            document.querySelectorAll('.seat.selected').forEach(seat => {
                seat.classList.remove('selected');
            });
            
            // 选择当前座位（不显示弹窗）
            e.target.classList.add('selected');
            selectedSeat = e.target;
            
            // 如果座位是空闲的，直接打开分配对话框
            const type = e.target.dataset.type;
            const row = e.target.dataset.row;
            const number = e.target.dataset.number;
            const area = e.target.dataset.area || '';
            
            if (!e.target.classList.contains('occupied')) {
                // 直接打开分配对话框
                assignAttendeeToSeat(row, number, type, area);
            }
        }
        
        // 分配人员到座位
        function assignAttendeeToSeat(row, number, type, area) {
            // 查找未分配座位的人员
            const unassignedAttendees = attendees.filter(a => !a.assignedSeat);
            
            if (unassignedAttendees.length === 0) {
                showMessage('所有参会人员已分配座位', 'warning');
                return;
            }
            
            // 创建选择对话框
            let options = '<option value="">请选择参会人员</option>';
            unassignedAttendees.forEach(attendee => {
                options += `<option value="${attendee.id}">${attendee.name} - ${attendee.position || '暂无职务'} - ${attendee.organization || '暂无机构'}</option>`;
            });
            
            const modal = document.createElement('div');
            modal.className = 'modal attendee-assignment-modal';
            modal.style.display = 'block';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close" onclick="closeAttendeeAssignmentModal(this)">&times;</span>
                    <h3 style="margin-bottom: 1rem; color: #2c3e50;">分配参会人员</h3>
                    <p><strong>座位信息：</strong>${type === 'leader' ? '领导席' : area} ${row}-${number}</p>
                    <div class="form-group">
                        <label>选择参会人员：</label>
                        <select id="attendeeSelect" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 3px;">
                            ${options}
                        </select>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                        <button class="btn btn-secondary" onclick="closeAttendeeAssignmentModal(this)">取消</button>
                        <button class="btn btn-primary" onclick="confirmAssignAttendee('${row}', '${number}', '${type}', '${area}')">确定</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // 点击外部关闭
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeAttendeeAssignmentModal(modal);
                }
            });
        }
        
        // 确认分配人员
        function confirmAssignAttendee(row, number, type, area) {
            const select = document.getElementById('attendeeSelect');
            const attendeeId = select.value;
            
            if (!attendeeId) {
                showMessage('请选择参会人员', 'warning');
                return;
            }
            
            const attendee = attendees.find(a => a.id === attendeeId);
            if (!attendee) return;
            
            // 检查座位是否已被占用
            const existingAttendee = attendees.find(a => 
                a.assignedSeat && 
                a.assignedSeat.type === type && 
                a.assignedSeat.row == row && 
                a.assignedSeat.number == number &&
                (type === 'leader' || a.assignedSeat.area === area)
            );
            
            if (existingAttendee) {
                showMessage('该座位已被占用', 'warning');
                return;
            }
            
            // 分配座位
            attendee.assignedSeat = { type, row: parseInt(row), number: parseInt(number), area };
            
            // 更新座位状态
            const seatElement = document.querySelector(`[data-type="${type}"][data-row="${row}"][data-number="${number}"]${type === 'audience' ? `[data-area="${area}"]` : ''}`);
            if (seatElement) {
                seatElement.classList.add('occupied');
                // 分配后显示姓名
                seatElement.textContent = attendee.name;
            }
            
            // 更新列表显示
            updateAttendeeList();
            
            // 关闭所有对话框
            closeAttendeeAssignmentModal();
            
            // 关闭其他可能存在的模态框
            document.querySelectorAll('.modal, .attendee-edit-modal').forEach(modal => {
                modal.remove();
            });
            
            showMessage(`已将 ${attendee.name} 分配到座位`, 'success');
        }
        
        // 关闭参会人员分配模态框
        function closeAttendeeAssignmentModal(element) {
            const modal = element ? element.closest('.attendee-assignment-modal') : document.querySelector('.attendee-assignment-modal');
            if (modal) {
                modal.remove();
            }
        }
        
        // 从座位移除人员
        function unassignAttendeeFromSeat(attendeeId) {
            const attendee = attendees.find(a => a.id === attendeeId);
            if (!attendee || !attendee.assignedSeat) return;
            
            const { type, row, number, area } = attendee.assignedSeat;
            
            // 移除分配
            attendee.assignedSeat = null;
            
            // 更新座位状态
            const seatElement = document.querySelector(`[data-type="${type}"][data-row="${row}"][data-number="${number}"]${type === 'audience' ? `[data-area="${area}"]` : ''}`);
            if (seatElement) {
                seatElement.classList.remove('occupied');
                // 移除后恢复座位编号显示
                seatElement.textContent = `${row}-${number}`;
            }
            
            // 更新列表显示
            updateAttendeeList();
            
            showMessage(`已将 ${attendee.name} 从座位移除`, 'success');
            
            // 关闭座位信息模态框
            closeSeatModal();
        }

        // 缓存管理器类
        class MeetingCacheManager {
            constructor() {
                this.cacheKey = 'meeting_seating_arrangement';
                this.autoSaveInterval = null;
                this.lastSaveTime = null;
                this.saveIndicatorTimeout = null;
                this.isSaving = false;
                console.log('缓存管理器已初始化');
                
                // 监听页面卸载事件，进行最后一次保存
                window.addEventListener('beforeunload', () => {
                    this.saveToLocalStorage();
                });
                
                // 页面加载时自动尝试恢复缓存
                setTimeout(() => {
                    const loadResult = this.loadFromLocalStorage();
                    console.log('缓存恢复结果:', loadResult);
                    this.updateCacheStatus();
                    
                    // 如果恢复了数据，显示提示信息
                    if (loadResult.success) {
                        showMessage('已从缓存恢复数据', 'info');
                    }
                }, 100);
            }

            // 保存当前状态到localStorage
            saveToLocalStorage() {
                // 防止重复保存
                if (this.isSaving) return { success: false, message: '正在保存中...' };
                
                try {
                    this.isSaving = true;
                    
                    // 收集需要缓存的数据
                    const audienceSection = document.querySelector('.audience-section');
                    const audienceSectionHeight = audienceSection ? parseInt(audienceSection.style.minHeight) || audienceSection.offsetHeight : 600;
                    
                    const cacheData = {
                        attendees: attendees,
                        seats: seats.map(seat => ({
                            id: seat.id,
                            type: seat.type,
                            area: seat.area,
                            row: seat.row,
                            number: seat.number,
                            occupied: seat.occupied,
                            attendeeId: seat.attendeeId,
                            // 不保存DOM元素引用
                        })),
                        leaderRows: document.getElementById('leaderRows').value,
                        seatsPerRow: document.getElementById('seatsPerRow').value,
                        aisleInterval: document.getElementById('aisleInterval').value,
                        audienceSectionHeight: audienceSectionHeight,
                        audienceAreas: Array.from(document.querySelectorAll('.audience-block')).map(block => {
                            const areaId = block.dataset.areaId;
                            const titleElement = block.querySelector('h4');
                            const titleText = titleElement ? titleElement.textContent : '';
                            const name = titleText.replace(/\s*\(.*\)$/, ''); // 提取区域名称
                            const style = block.style;
                            return {
                                id: areaId,
                                name: name,
                                position: {
                                    left: style.left || '0px',
                                    top: style.top || '0px',
                                    position: style.position || 'static'
                                },
                                config: {
                                    rows: parseInt(block.dataset.rows) || 5,
                                    cols: parseInt(block.dataset.cols) || 5
                                }
                            };
                        }),
                        timestamp: Date.now()
                    };

                    // 保存到localStorage
                    localStorage.setItem(this.cacheKey, JSON.stringify(cacheData));
                    this.lastSaveTime = new Date().toLocaleString();
                    
                    // 更新保存状态指示器
                    this.updateSaveStatus(true);
                    this.updateCacheStatus();
                    
                    console.log('数据已保存到本地缓存', this.lastSaveTime);
                    return { success: true, message: '缓存保存成功' };
                } catch (error) {
                    console.error('保存缓存失败:', error);
                    this.updateSaveStatus(false);
                    return { success: false, message: '缓存保存失败: ' + error.message };
                } finally {
                    this.isSaving = false;
                }
            }

            // 从localStorage加载数据
            loadFromLocalStorage() {
                try {
                    const cachedData = localStorage.getItem(this.cacheKey);
                    if (!cachedData) {
                        console.log('没有找到缓存数据');
                        return { success: false, message: '没有找到缓存数据' };
                    }

                    const parsedData = JSON.parse(cachedData);
                    
                    // 恢复参会人员数据
                    if (Array.isArray(parsedData.attendees)) {
                        attendees = parsedData.attendees;
                        console.log('已恢复参会人员数据，共', attendees.length, '人');
                    }

                    // 恢复布局配置
                    if (parsedData.leaderRows) {
                        document.getElementById('leaderRows').value = parsedData.leaderRows;
                    }
                    if (parsedData.seatsPerRow) {
                        document.getElementById('seatsPerRow').value = parsedData.seatsPerRow;
                    }
                    if (parsedData.aisleInterval) {
                        document.getElementById('aisleInterval').value = parsedData.aisleInterval;
                    }

                    // 重新生成布局
                    updateLayout();
                    
                    // 恢复观众席画布高度
                    if (parsedData.audienceSectionHeight) {
                        const audienceSection = document.querySelector('.audience-section');
                        if (audienceSection) {
                            audienceSection.style.minHeight = parsedData.audienceSectionHeight + 'px';
                            console.log('已恢复观众席画布高度:', parsedData.audienceSectionHeight + 'px');
                        }
                    }

                    // 恢复观众区
                    if (Array.isArray(parsedData.audienceAreas)) {
                        // 清空现有的观众区，避免重复创建
                        const audienceSection = document.getElementById('audienceSection');
                        if (audienceSection) {
                            const existingBlocks = audienceSection.querySelectorAll('.audience-block');
                            existingBlocks.forEach(block => block.remove());
                        }
                        
                        // 清空座位数组中与观众区相关的数据
                        seats = seats.filter(seat => seat.type !== 'audience');
                        
                        // 首先获取当前已有的观众区ID（此时应该为空）
                        const existingAreaIds = new Set();
                        document.querySelectorAll('.audience-block').forEach(block => {
                            existingAreaIds.add(block.dataset.areaId);
                        });
                        
                        parsedData.audienceAreas.forEach(cachedArea => {
                            let areaBlock = document.querySelector(`.audience-block[data-area-id="${cachedArea.id}"]`);
                            
                            // 如果区域不存在，则创建新的观众区
                            if (!areaBlock && cachedArea.id && cachedArea.name) {
                                console.log(`创建缺失的观众区: ${cachedArea.name} (${cachedArea.id})`);
                                
                                const audienceSection = document.getElementById('audienceSection');
                                
                                // 创建新的观众区容器
                                areaBlock = document.createElement('div');
                                areaBlock.className = 'audience-block';
                                areaBlock.dataset.areaId = cachedArea.id;
                                areaBlock.dataset.rows = cachedArea.config?.rows || 5;
                                areaBlock.dataset.cols = cachedArea.config?.cols || 5;
                                
                                // 设置区域标题
                                const title = document.createElement('h4');
                                title.textContent = cachedArea.name;
                                title.style.cursor = 'default';
                                title.title = '拖动区域块，双击恢复位置';
                                areaBlock.appendChild(title);
                                
                                // 编辑控制按钮（添加编辑和删除按钮）
                                const editControls = document.createElement('div');
                                editControls.className = 'area-edit-controls';
                                editControls.innerHTML = `
                                    <button class="area-edit-btn edit" onclick="openAreaTitleModal(${cachedArea.id})" title="编辑区域">编辑</button>
                                    <button class="area-edit-btn delete" onclick="deleteArea(${cachedArea.id})" title="删除区域">删除</button>
                                `;
                                areaBlock.appendChild(editControls);
                                
                                // 创建座位容器
                                const seatsContainer = document.createElement('div');
                                seatsContainer.className = 'seats-container';
                                areaBlock.appendChild(seatsContainer);
                                
                                // 添加到观众席区域
                                audienceSection.appendChild(areaBlock);
                                
                                // 添加拖动功能
                                makeAreaDraggable(areaBlock);
                                
                                // 添加编辑功能
                                areaBlock.addEventListener('dblclick', function() {
                                    enterAreaEditMode(areaBlock);
                                });
                            }
                            
                            // 恢复位置信息
                            if (areaBlock && cachedArea.position) {
                                const leftPos = cachedArea.position.left || '0px';
                                const topPos = cachedArea.position.top || '0px';
                                const posType = cachedArea.position.position || 'absolute';
                                
                                areaBlock.style.position = posType;
                                areaBlock.style.left = leftPos;
                                areaBlock.style.top = topPos;
                                console.log(`恢复观众区位置: ${cachedArea.name} - left: ${leftPos}, top: ${topPos}`);
                            }
                            
                            // 恢复行列配置
                            if (areaBlock && cachedArea.config) {
                                areaBlock.dataset.rows = cachedArea.config.rows || 5;
                                areaBlock.dataset.cols = cachedArea.config.cols || 5;
                                
                                // 获取行列配置
                                const rows = cachedArea.config.rows || parseInt(areaBlock.dataset.rows) || 5;
                                const cols = cachedArea.config.cols || parseInt(areaBlock.dataset.cols) || 5;
                                
                                // 确保座位容器存在
                                let seatsContainer = areaBlock.querySelector('.seats-container');
                                if (!seatsContainer) {
                                    seatsContainer = document.createElement('div');
                                    seatsContainer.className = 'seats-container';
                                    areaBlock.appendChild(seatsContainer);
                                }
                                
                                // 清空现有座位并重新生成
                                seatsContainer.innerHTML = '';
                                
                                // 生成座位
                                const areaId = parseInt(cachedArea.id);
                                const areaName = cachedArea.name;
                                let seatCounter = 0;
                                
                                // 创建座位网格容器
                                const seatsGrid = document.createElement('div');
                                seatsGrid.className = 'area-seats-grid';
                                
                                // 设置网格样式 - 修复座位排列异常问题
                                const maxColumnsPerRow = Math.min(cols, 20);
                                seatsGrid.style.gridTemplateColumns = `repeat(${maxColumnsPerRow}, minmax(35px, 1fr))`;
                                seatsGrid.style.display = 'grid';
                                seatsGrid.style.justifyContent = 'center';
                                seatsGrid.style.marginLeft = 'auto';
                                seatsGrid.style.marginRight = 'auto';
                                seatsGrid.style.width = 'fit-content';
                                 
                                // 设置区域块宽度 - 修复尺寸不正确问题
                                const optimalWidth = Math.min(maxColumnsPerRow * 55 + 40, window.innerWidth - 100);
                                areaBlock.style.width = `${optimalWidth}px`;
                                areaBlock.style.maxWidth = '100%';
                                
                                seatsContainer.appendChild(seatsGrid);
                                
                                // 生成座位
                                for (let row = 0; row < rows; row++) {
                                    for (let col = 0; col < cols; col++) {
                                        const seatElement = document.createElement('div');
                                        seatElement.className = 'seat';
                                        seatElement.style.position = 'static'; // 覆盖CSS中的position:absolute，使grid布局正常工作
                                        seatElement.textContent = `${row + 1}-${col + 1}`;
                                        seatElement.dataset.area = areaName;
                                        seatElement.dataset.row = row + 1;
                                        seatElement.dataset.number = col + 1;
                                        seatElement.dataset.type = 'audience';
                                        seatElement.dataset.areaId = areaId;
                                        seatElement.onclick = () => selectSeat(seatElement);
                                        
                                        seats.push({
                                            element: seatElement,
                                            area: areaName,
                                            areaId: areaId,
                                            row: row + 1,
                                            number: col + 1,
                                            type: 'audience',
                                            occupied: false
                                        });
                                        
                                        seatsGrid.appendChild(seatElement);
                                        seatCounter++;
                                    }
                                }
                                
                                // 更新区域标题显示座位数
                                areaBlock.querySelector('h4').textContent = `${areaName} (${rows}排×${cols}列=${seatCounter}座)`;
                                
                                console.log(`为观众区 ${areaName} 生成座位: ${rows}行 x ${cols}列`);
                            }
                        });
                        
                        // 调整会议厅大小
                        setTimeout(adjustMeetingHallSize, 100);
                        
                        // 为新创建的座位添加拖拽事件
                        addSeatDragEvents();
                    }

                    // 更新参会人员列表和座位显示
                    updateAttendeeList();
                    this.restoreAssignedSeats(parsedData.attendees);

                    console.log('缓存数据加载成功');
                    return { success: true, message: '缓存数据加载成功' };
                } catch (error) {
                    console.error('加载缓存失败:', error);
                    return { success: false, message: '缓存加载失败: ' + error.message };
                }
            }

            // 恢复已分配的座位
            restoreAssignedSeats(attendeesData) {
                if (!Array.isArray(attendeesData)) return;
                
                attendeesData.forEach(attendee => {
                    if (attendee.assignedSeat) {
                        const { type, row, number, area } = attendee.assignedSeat;
                        const seatElement = document.querySelector(`[data-type="${type}"][data-row="${row}"][data-number="${number}"]${type === 'audience' ? `[data-area="${area}"]` : ''}`);
                        if (seatElement) {
                            seatElement.classList.add('occupied');
                            seatElement.textContent = attendee.name;
                        }
                    }
                });
            }

            // 清除缓存
            clearCache() {
                try {
                    localStorage.removeItem(this.cacheKey);
                    this.lastSaveTime = null;
                    console.log('缓存已清除');
                    return { success: true, message: '缓存已清除' };
                } catch (error) {
                    console.error('清除缓存失败:', error);
                    return { success: false, message: '清除缓存失败: ' + error.message };
                }
            }

            // 验证缓存数据
            verifyCache() {
                try {
                    const cachedData = localStorage.getItem(this.cacheKey);
                    if (!cachedData) {
                        return { valid: false, message: '缓存不存在' };
                    }

                    const parsedData = JSON.parse(cachedData);
                    const hasAttendees = Array.isArray(parsedData.attendees) && parsedData.attendees.length > 0;
                    const hasLayoutData = parsedData.leaderRows && parsedData.seatsPerRow;
                    
                    return {
                        valid: hasAttendees || hasLayoutData,
                        message: `缓存验证通过<br>参会人员: ${parsedData.attendees?.length || 0} 人<br>布局配置: ${hasLayoutData ? '存在' : '不存在'}<br>保存时间: ${new Date(parsedData.timestamp).toLocaleString()}`
                    };
                } catch (error) {
                    return { valid: false, message: '缓存数据无效: ' + error.message };
                }
            }

            // 开始自动保存
            startAutoSave(intervalMs = 30000) { // 默认30秒自动保存一次
                if (this.autoSaveInterval) {
                    clearInterval(this.autoSaveInterval);
                }
                
                this.autoSaveInterval = setInterval(() => {
                    console.log('自动保存数据...');
                    this.saveToLocalStorage();
                }, intervalMs);
                
                console.log(`已启动自动保存，间隔 ${intervalMs/1000} 秒`);
            }
            
            // 触发即时保存（用于关键操作后）
            triggerSave() {
                console.log('触发即时保存...');
                return this.saveToLocalStorage();
            }

            // 停止自动保存
            stopAutoSave() {
                if (this.autoSaveInterval) {
                    clearInterval(this.autoSaveInterval);
                    this.autoSaveInterval = null;
                    console.log('已停止自动保存');
                }
            }

            // 更新保存状态指示器（已改为右下角提示）
        updateSaveStatus(success) {
            // 使用右下角通知替代
            if (success) {
                showSaveNotification('数据已自动保存');
            }
        }

            // 测试缓存功能
            testCacheFunctionality() {
                // 保存当前状态
                const saveResult = this.saveToLocalStorage();
                if (!saveResult.success) {
                    return { valid: false, message: '保存测试失败: ' + saveResult.message };
                }

                // 验证保存结果
                const verifyResult = this.verifyCache();
                if (!verifyResult.valid) {
                    return { valid: false, message: '验证失败: ' + verifyResult.message };
                }

                return { valid: true, message: '缓存功能测试通过' };
        }
        
        // 更新缓存状态显示（已改为右下角提示）
        updateCacheStatus() {
            // 不再更新UI状态显示
        }
        
        // 格式化时间显示
        formatTime(timestamp) {
            const now = new Date();
            const date = typeof timestamp === 'string' ? new Date(timestamp) : new Date();
            const diffMs = now - date;
            const diffSecs = Math.floor(diffMs / 1000);
            const diffMins = Math.floor(diffSecs / 60);
            
            if (diffSecs < 60) {
                return `${diffSecs}秒前`;
            } else if (diffMins < 60) {
                return `${diffMins}分钟前`;
            } else {
                return date.toLocaleTimeString('zh-CN');
            }
        }
        
        // 更新保存状态指示器（改为右下角提示）
        updateSaveStatus(isSuccess) {
            // 显示临时的保存成功提示在右下角
            if (isSuccess) {
                showSaveNotification('数据已自动保存');
            }
        }
    }
    
    // 缓存相关功能函数已移除
    // 缓存操作已改为完全后台自动处理

    // 显示保存成功提示
    function showSaveNotification(message) {
        const notification = document.getElementById('saveNotification');
        const notificationText = document.getElementById('saveNotificationText');
        
        if (notification && notificationText) {
            // 更新消息内容
            notificationText.textContent = message || '数据已自动保存';
            
            // 显示通知
            notification.style.opacity = '1';
            notification.style.transform = 'translateY(0)';
            
            // 3秒后自动隐藏
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateY(20px)';
            }, 3000);
        }
    }

        // 截图导出功能 - 使用html2canvas实现真正的截图效果
        function exportScreenshot() {
            try {
                // 获取会议厅元素
                const meetingHall = document.getElementById('meetingHall');
                if (!meetingHall) {
                    showMessage('找不到会议厅元素！', 'error');
                    return;
                }

                // 显示加载提示
                showMessage('正在生成截图，请稍候...', 'info');

                // 使用html2canvas进行截图
                html2canvas(meetingHall, {
                    backgroundColor: '#f8f9fa',
                    scale: 2, // 高分辨率
                    useCORS: true,
                    allowTaint: true,
                    width: meetingHall.scrollWidth,
                    height: meetingHall.scrollHeight,
                    scrollX: 0,
                    scrollY: 0,
                    x: 0,
                    y: 0
                }).then(canvas => {
                    // 创建新的画布用于添加标题和边框
                    const finalCanvas = document.createElement('canvas');
                    const finalCtx = finalCanvas.getContext('2d');
                    
                    // 设置最终画布尺寸
                    const padding = 40;
                    const titleHeight = 80;
                    finalCanvas.width = canvas.width + padding * 2;
                    finalCanvas.height = canvas.height + padding * 2 + titleHeight;
                    
                    // 启用高DPI支持
                    const devicePixelRatio = window.devicePixelRatio || 1;
                    finalCanvas.width *= devicePixelRatio;
                    finalCanvas.height *= devicePixelRatio;
                    finalCtx.scale(devicePixelRatio, devicePixelRatio);
                    
                    // 绘制背景
                    finalCtx.fillStyle = '#ffffff';
                    finalCtx.fillRect(0, 0, finalCanvas.width / devicePixelRatio, finalCanvas.height / devicePixelRatio);
                    
                    // 绘制标题背景渐变
                    const titleGradient = finalCtx.createLinearGradient(0, 0, 0, titleHeight);
                    titleGradient.addColorStop(0, '#2c3e50');
                    titleGradient.addColorStop(1, '#34495e');
                    finalCtx.fillStyle = titleGradient;
                    finalCtx.fillRect(0, 0, finalCanvas.width / devicePixelRatio, titleHeight);
                    
                    // 绘制标题文字
                    finalCtx.fillStyle = '#ffffff';
                    finalCtx.font = 'bold 24px Microsoft YaHei, Arial, sans-serif';
                    finalCtx.textAlign = 'center';
                    finalCtx.textBaseline = 'middle';
                    finalCtx.fillText('会议厅座位安排截图', finalCanvas.width / (2 * devicePixelRatio), titleHeight / 2);
                    
                    // 绘制副标题（日期）
                    finalCtx.fillStyle = '#ecf0f1';
                    finalCtx.font = '16px Microsoft YaHei, Arial, sans-serif';
                    const today = new Date().toLocaleDateString('zh-CN') + ' ' + new Date().toLocaleTimeString('zh-CN');
                    finalCtx.fillText(`截图时间：${today}`, finalCanvas.width / (2 * devicePixelRatio), titleHeight - 20);
                    
                    // 绘制截图内容
                    finalCtx.drawImage(canvas, padding, titleHeight + padding);
                    
                    // 添加边框
                    finalCtx.strokeStyle = '#dee2e6';
                    finalCtx.lineWidth = 1;
                    finalCtx.strokeRect(padding, titleHeight + padding, canvas.width, canvas.height);
                    
                    // 导出为图片
                    finalCanvas.toBlob((blob) => {
                        if (blob) {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `会议厅截图_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.png`;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                            
                            // 清理画布
                            finalCanvas.remove();
                            canvas.remove();
                            
                            showMessage('截图导出成功！', 'success');
                        }
                    }, 'image/png', 0.95);
                    
                }).catch(error => {
                    console.error('截图失败:', error);
                    showMessage('截图导出失败：' + error.message, 'error');
                });
                
            } catch (error) {
                console.error('截图导出失败:', error);
                showMessage('截图导出失败：' + error.message, 'error');
            }
        }
